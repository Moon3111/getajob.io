name: Fetch and ingest jobs

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  apify-ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Apify cron
        env:
          FETCH_URL: ${{ secrets.VERCEL_FETCH_JOBS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$FETCH_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set VERCEL_FETCH_JOBS_URL and CRON_SECRET repository secrets"
            exit 1
          fi
          curl -sS -X POST "$FETCH_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-cron-secret: $CRON_SECRET"
